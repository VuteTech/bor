name: "bor-agent"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
maintainer: "VuteTech <info@vutetech.com>"
description: |
  Bor Policy Management Agent.
  Connects to the Bor server and enforces desktop policies
  on Linux endpoints (Firefox, Chrome/Chromium, KDE Kiosk).
homepage: "https://getbor.dev"
license: "AGPL-3.0-only"

contents:
  # Binary
  - src: agent/bor-agent
    dst: /usr/bin/bor-agent
    file_info:
      mode: 0755

  # License text (AGPL-3.0-only requires a copy with every binary)
  - src: LICENSE
    dst: /usr/share/licenses/bor-agent/LICENSE
    file_info:
      mode: 0644

  # Default config (preserved on upgrade)
  - src: agent/config.yaml.example
    dst: /etc/bor/config.yaml
    type: config|noreplace
    file_info:
      mode: 0600

  # Systemd unit
  - src: packaging/systemd/bor-agent.service
    dst: /lib/systemd/system/bor-agent.service
    file_info:
      mode: 0644

  # Directories
  - dst: /etc/bor
    type: dir
    file_info:
      mode: 0755

  - dst: /var/lib/bor/agent
    type: dir
    file_info:
      mode: 0750

# Disk encryption (DiskEncryption policy type): cryptsetup drives the LUKS2
# operations; clevis and tpm2-tools are only needed when a policy enables the
# Tang or TPM2 protectors, so they stay suggestions.
recommends:
  - cryptsetup
suggests:
  - clevis-luks
  - clevis-dracut
  - tpm2-tools

# Per-format lists replace the ones above, so they repeat them. The reboot
# signal of the Software updates type comes from needrestart on Debian and
# Ubuntu (Debian does not write /run/reboot-required on its own) and from
# the needs-restarting plugin on Fedora (dnf5-plugins) and RHEL
# (python3-dnf-plugins-core); a weak dependency on a package the
# distribution does not carry is ignored.
overrides:
  deb:
    depends:
      - needrestart
    recommends:
      - cryptsetup
    suggests:
      - clevis-luks
      - clevis-dracut
      - tpm2-tools
  rpm:
    recommends:
      - cryptsetup
      - dnf5-plugins
      - python3-dnf-plugins-core
    suggests:
      - clevis-luks
      - clevis-dracut
      - tpm2-tools

scripts:
  postinstall: packaging/scripts/postinstall-agent.sh
  preremove: packaging/scripts/preremove-agent.sh

rpm:
  scripts:
    posttrans: packaging/scripts/posttrans-agent.sh
