syntax = "proto3";

package bor.policy.v1;

import "google/protobuf/struct.proto";
import "ui.proto";

option go_package = "github.com/VuteTech/Bor/server/pkg/grpc/policy;policy";

// EdgePolicy holds Microsoft Edge enterprise policy settings for Linux.
// Each field maps to an official Edge policy:
// https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies
// Only Linux-compatible policies are included. Windows-only categories
// (Internet Explorer Mode, Application Guard, Windows Hello, Kiosk Mode)
// are intentionally omitted.
// All Edge channels (stable, beta, dev) read from /etc/opt/edge/policies/.
message EdgePolicy {

