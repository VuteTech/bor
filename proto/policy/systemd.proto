syntax = "proto3";

package bor.policy.v1;

option go_package = "github.com/VuteTech/Bor/server/pkg/grpc/policy;policy";

// SystemdPolicy manages systemd services and timers on a node: the desired
// state of existing units (enabled / disabled / masked, running / stopped),
// drop-in overrides for their timer schedule and service settings, and
// Bor-deployed scheduled tasks. Several bound policies are merged per unit
// and per task by binding priority; on equal priority the more restrictive
// value wins.
message SystemdPolicy {
  // Existing units and their desired state.
  repeated SystemdUnit units = 1;
  // Bor-deployed service/timer pairs with their script. Saving or
  // releasing a policy with tasks requires the systemd:exec permission.
  repeated SystemdTask tasks = 2;
  // Also write /etc/systemd/system-preset/10-bor.preset so the enablement
  // decisions of the units section apply to units installed later.
  bool write_presets = 3;
}

// SystemdEnablement is the desired unit-file state.
enum SystemdEnablement {
  // Keep the unit-file state as it is.
  SYSTEMD_ENABLEMENT_UNSPECIFIED = 0;
  SYSTEMD_ENABLEMENT_ENABLED = 1;
  SYSTEMD_ENABLEMENT_DISABLED = 2;
  // Mask the unit: it can no longer be started, not even as a dependency.
  SYSTEMD_ENABLEMENT_MASKED = 3;
}

// SystemdActivity is the desired activation state, re-asserted on every
// sync and on every reconcile pass.
enum SystemdActivity {
  // Keep the activation state as it is.
  SYSTEMD_ACTIVITY_UNSPECIFIED = 0;
  // Active (running, waiting or listening).
  SYSTEMD_ACTIVITY_RUNNING = 1;
  SYSTEMD_ACTIVITY_STOPPED = 2;
}

// SystemdScope says which manager a unit or task belongs to.
enum SystemdScope {
  // The system manager (same as SYSTEM).
  SYSTEMD_SCOPE_UNSPECIFIED = 0;
  // The system manager: units under /etc/systemd/system, enablement and
  // activity through the system bus.
  SYSTEMD_SCOPE_SYSTEM = 1;
  // The user managers of every user: files under /etc/systemd/user,
  // enablement as "systemctl --global" does it, activity applied in the
  // manager of every logged-in user.
  SYSTEMD_SCOPE_GLOBAL = 2;
}

// SystemdUnit is the desired state of one existing unit.
message SystemdUnit {
  // Full unit name with suffix: "bluetooth.service", "fstrim.timer",
  // "cups.socket", "ctrl-alt-del.target".
  string name = 1;
  SystemdEnablement enablement = 2;
  SystemdActivity activity = 3;
  // Restart a running service after its drop-in changed. Timers are always
  // restarted after a schedule change because the new schedule applies
  // only then.
  bool restart_on_change = 4;
  // Drop-in written to /etc/systemd/system/<name>.d/90-bor.conf.
  SystemdDropIn drop_in = 5;
  // For timers and oneshot services: the last run must have succeeded for
  // the unit to count as compliant.
  bool require_last_run_success = 6;
  // Free text shown in the editor and the compliance view.
  string description = 7;
  // Which manager the unit belongs to; unset means the system manager.
  SystemdScope scope = 8;
}

// SystemdDropIn is the content of the Bor drop-in for one unit.
message SystemdDropIn {
  SystemdTimerSettings timer = 1;
  SystemdServiceSettings service = 2;
  // Raw directives for anything the typed settings do not cover. Exec*
  // directives make the policy command-running (systemd:exec permission).
  repeated SystemdDirective raw = 3;
}

// SystemdDirective is one raw unit-file directive.
message SystemdDirective {
  // Unit | Service | Timer | Socket | Path | Install
  string section = 1;
  // Directive name, e.g. "ExecStartPre" or "IPAddressDeny".
  string key = 2;
  // One line per value. An empty list writes "Key=" alone, which resets a
  // list directive; a list directive with values is reset first and then
  // set to exactly these values.
  repeated string values = 3;
}

// SystemdTaskTrigger says what starts a Bor-deployed task.
enum SystemdTaskTrigger {
  SYSTEMD_TASK_TRIGGER_UNSPECIFIED = 0;
  // A timer with the task's schedule (bor-<name>.timer).
  SYSTEMD_TASK_TRIGGER_TIMER = 1;
  // At boot: the service is wanted by multi-user.target.
  SYSTEMD_TASK_TRIGGER_BOOT = 2;
}

// SystemdTask is a Bor-deployed scheduled task: bor-<name>.service, a
// bor-<name>.timer when the trigger is a timer, and the script
// /etc/bor/systemd/<name>.sh. The agent adds the "bor-" prefix; the policy
// carries the bare name.
message SystemdTask {
  // ^[a-z0-9][a-z0-9-]{0,47}$
  string name = 1;
  // Free text; becomes the unit's Description.
  string description = 2;
  SystemdTaskTrigger trigger = 3;
  // Timer settings; required for the timer trigger.
  SystemdTimerSettings schedule = 4;
  // Exactly one of script or exec_start. The script is written verbatim to
  // /etc/bor/systemd/<name>.sh (0755) and must start with "#!"; it is
  // limited to 64 KiB.
  string script = 5;
  // argv of the program to run instead of a script; [0] is an absolute
  // path. No shell is involved.
  repeated string exec_start = 6;
  // User and group the service runs as (default root).
  string user = 7;
  string group = 8;
  string working_directory = 9;
  // KEY=value entries for the service environment.
  repeated string environment = 10;
  // TimeoutStartSec of the service (default 1h).
  string timeout_start_sec = 11;
  // Sandboxing defaults (NoNewPrivileges, PrivateTmp, ProtectKernelTunables,
  // ProtectControlGroups, RestrictSUIDSGID, ProtectClock, ProtectHostname).
  // Unset means on.
  optional bool hardened = 12;
  // The last run must have succeeded for the task to count as compliant.
  bool require_last_run_success = 13;
  // Whether the timer (or the boot-triggered service) is enabled. Unset
  // means on; false deploys the files without activating anything.
  optional bool enabled = 14;
  // Which manager runs the task; unset means the system manager. A
  // GLOBAL task runs in every user's manager as that user (user and
  // group must be empty) and is wanted by default.target at login.
  SystemdScope scope = 15;
  // AppArmorProfile= of the service: the profile the task runs under, by
  // the name it is loaded with on the node (for example bor-<name> from an
  // AppArmor policy). A leading "-" lets the task start when the profile
  // is missing.
  string apparmor_profile = 16;
  // SELinuxContext= of the service: the user:role:type[:level] the task
  // runs as. A leading "-" lets the task start when the transition fails.
  string selinux_context = 17;
}

// SystemdTimerSettings are [Timer] directives. Values use systemd syntax
// (calendar expressions and time spans); an empty value leaves the
// directive untouched. A trigger directive that is set replaces the
// vendor value of that directive.
message SystemdTimerSettings {
  // Calendar expressions, e.g. "Sat *-*-* 03:00:00" or "daily".
  repeated string on_calendar = 1;
  string on_boot_sec = 2;
  string on_startup_sec = 3;
  string on_active_sec = 4;
  string on_unit_active_sec = 5;
  string on_unit_inactive_sec = 6;
  // Catch up a run that was missed while the node was off.
  optional bool persistent = 7;
  // Random delay added to every trigger to spread a fleet.
  string randomized_delay_sec = 8;
  string accuracy_sec = 9;
  optional bool wake_system = 10;
  // Keep the same random delay for every trigger (systemd >= 247).
  optional bool fixed_random_delay = 11;
  // Trigger when the system clock jumps (systemd >= 242).
  optional bool on_clock_change = 12;
  // Trigger when the timezone changes (systemd >= 242).
  optional bool on_timezone_change = 13;
}

// SystemdServiceSettings are [Service] directives.
message SystemdServiceSettings {
  // no | on-success | on-failure | on-abnormal | on-abort | on-watchdog | always
  string restart = 1;
  string restart_sec = 2;
  string timeout_start_sec = 3;
  string timeout_stop_sec = 4;
  // KEY=value entries added to the service environment.
  repeated string environment = 5;
  // Memory limit, e.g. "512M" or "20%".
  string memory_max = 6;
  // CPU quota, e.g. "50%".
  string cpu_quota = 7;
  string tasks_max = 8;
  // Scheduling priority, -20..19.
  string nice = 9;
  optional bool no_new_privileges = 10;
  // yes | no | full | strict
  string protect_system = 11;
  // yes | no | read-only | tmpfs
  string protect_home = 12;
  optional bool private_tmp = 13;
}

// SystemdUnitInfo describes one unit installed on a node, as reported for
// the unit catalogue the editor offers.
message SystemdUnitInfo {
  string name = 1;
  string description = 2;
  // service | timer | socket | target | path
  string type = 3;
  // enabled | disabled | static | masked | indirect | generated | ...
  string unit_file_state = 4;
  // enabled | disabled | "" (vendor preset)
  string preset = 5;
  string active_state = 6;
  string sub_state = 7;
  // The unit file has an [Install] section and can be enabled or disabled.
  bool has_install = 8;
  // Timers: the OnCalendar expressions of the unit file.
  repeated string on_calendar = 9;
  // Timers, sockets and paths: the unit they activate.
  string triggers = 10;
  string fragment_path = 11;
  // Services: simple | oneshot | notify | forking | ...
  string service_type = 12;
  // Services: the overall exposure level systemd-analyze security
  // computes ("9.6"), empty when unknown.
  string security_exposure = 13;
  // Services: the exposure predicate (SAFE | OK | MEDIUM | EXPOSED |
  // UNSAFE), empty when unknown.
  string security_predicate = 14;
}

// ReportSystemdCatalogueRequest carries the unit inventory of a node.
message ReportSystemdCatalogueRequest {
  string client_id = 1;
  repeated SystemdUnitInfo units = 2;
  // systemd version from the manager, e.g. "252".
  string systemd_version = 3;
}

message ReportSystemdCatalogueResponse {}

// SystemdUnitActionKind is an on-demand operation on a unit of the system
// manager, requested from the node page.
enum SystemdUnitActionKind {
  SYSTEMD_UNIT_ACTION_UNSPECIFIED = 0;
  SYSTEMD_UNIT_ACTION_START = 1;
  SYSTEMD_UNIT_ACTION_STOP = 2;
  SYSTEMD_UNIT_ACTION_RESTART = 3;
}

// SystemdUnitAction is the server-to-agent command carried by a
// PolicyUpdate of type SYSTEMD_UNIT_ACTION. The agent answers with
// ReportSystemdUnitActionResult.
message SystemdUnitAction {
  // Server-generated id the result refers to.
  string id = 1;
  string unit = 2;
  SystemdUnitActionKind action = 3;
}

// ReportSystemdUnitActionResultRequest is the outcome of one action.
message ReportSystemdUnitActionResultRequest {
  string client_id = 1;
  string action_id = 2;
  bool success = 3;
  // The job result, the error, or a note (for example that a bound policy
  // keeps the unit in another state and will reconcile it).
  string message = 4;
  // The unit after the action, so the server can refresh its catalogue
  // row without a full report.
  SystemdUnitInfo unit = 5;
}

message ReportSystemdUnitActionResultResponse {}
