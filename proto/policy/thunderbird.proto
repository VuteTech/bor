syntax = "proto3";

package bor.policy.v1;

option go_package = "github.com/VuteTech/Bor/server/pkg/grpc/policy;policy";

import "ui.proto";

// ThunderbirdPolicy is the canonical schema for a Thunderbird enterprise
// policy on Linux.  It maps directly to the "policies" key in policies.json.
// Field json_name annotations preserve PascalCase so protojson round-trips
// with the key names Thunderbird expects.
message ThunderbirdPolicy {
  // ── Updates ───────────────────────────────────────────────────────────────
  optional bool   DisableAppUpdate    = 1  [json_name = "DisableAppUpdate",    (bor.ui.field) = {group: "Updates"}];
  optional bool   AppAutoUpdate       = 2  [json_name = "AppAutoUpdate",       (bor.ui.field) = {group: "Updates"}];
  optional bool   BackgroundAppUpdate = 3  [json_name = "BackgroundAppUpdate", (bor.ui.field) = {group: "Updates"}];
  optional bool   ManualAppUpdateOnly = 4  [json_name = "ManualAppUpdateOnly", (bor.ui.field) = {group: "Updates"}];
  optional string AppUpdatePin        = 5  [json_name = "AppUpdatePin",        (bor.ui.field) = {group: "Updates"}];
  optional string AppUpdateURL        = 6  [json_name = "AppUpdateURL",        (bor.ui.field) = {group: "Updates"}];

  // ── Privacy & Telemetry ───────────────────────────────────────────────────
  optional bool DisableTelemetry = 10 [json_name = "DisableTelemetry", (bor.ui.field) = {group: "Privacy & Telemetry"}];

  // ── Security ──────────────────────────────────────────────────────────────
  optional bool   DisablePasswordReveal         = 20 [json_name = "DisablePasswordReveal",         (bor.ui.field) = {group: "Security"}];
  optional bool   DisableMasterPasswordCreation = 21 [json_name = "DisableMasterPasswordCreation", (bor.ui.field) = {group: "Security"}];
  optional bool   PrimaryPassword               = 22 [json_name = "PrimaryPassword",               (bor.ui.field) = {group: "Security"}];
  optional bool   PasswordManagerEnabled        = 23 [json_name = "PasswordManagerEnabled",        (bor.ui.field) = {group: "Security"}];
  optional bool   OfferToSaveLogins             = 24 [json_name = "OfferToSaveLogins",             (bor.ui.field) = {group: "Security"}];
  optional bool   OfferToSaveLoginsDefault      = 25 [json_name = "OfferToSaveLoginsDefault",      (bor.ui.field) = {group: "Security"}];
  optional bool   DisableSecurityBypass         = 26 [json_name = "DisableSecurityBypass",         (bor.ui.field) = {group: "Security"}];
  optional string SSLVersionMin                 = 27 [
    json_name = "SSLVersionMin",
    (bor.ui.field) = {
      group: "Security",
      string_options: ["tls1", "tls1.1", "tls1.2", "tls1.3"]
    }
  ];
  optional string SSLVersionMax                 = 28 [
    json_name = "SSLVersionMax",
    (bor.ui.field) = {
      group: "Security",
      string_options: ["tls1", "tls1.1", "tls1.2", "tls1.3"]
    }
  ];

  // ── Restrictions ──────────────────────────────────────────────────────────
  optional bool BlockAboutAddons   = 30 [json_name = "BlockAboutAddons",   (bor.ui.field) = {group: "Restrictions"}];
  optional bool BlockAboutConfig   = 31 [json_name = "BlockAboutConfig",   (bor.ui.field) = {group: "Restrictions"}];
  optional bool BlockAboutProfiles = 32 [json_name = "BlockAboutProfiles", (bor.ui.field) = {group: "Restrictions"}];
  optional bool BlockAboutSupport  = 33 [json_name = "BlockAboutSupport",  (bor.ui.field) = {group: "Restrictions"}];
  optional bool DisableSafeMode    = 34 [json_name = "DisableSafeMode",    (bor.ui.field) = {group: "Restrictions"}];

  // ── Developer Tools ───────────────────────────────────────────────────────
  optional bool DisableDeveloperTools = 40 [json_name = "DisableDeveloperTools", (bor.ui.field) = {group: "Developer Tools"}];

  // ── Add-ons / Extensions ──────────────────────────────────────────────────
  optional bool DisableSystemAddonUpdate = 50 [json_name = "DisableSystemAddonUpdate", (bor.ui.field) = {group: "Add-ons"}];
  optional bool ExtensionUpdate          = 51 [json_name = "ExtensionUpdate",          (bor.ui.field) = {group: "Add-ons"}];

  // ── Network ───────────────────────────────────────────────────────────────
  optional bool HardwareAcceleration = 60 [json_name = "HardwareAcceleration", (bor.ui.field) = {group: "Network"}];
  optional bool NetworkPrediction    = 61 [json_name = "NetworkPrediction",    (bor.ui.field) = {group: "Network"}];
  optional bool CaptivePortal        = 62 [json_name = "CaptivePortal",        (bor.ui.field) = {group: "Network"}];

  // ── General ───────────────────────────────────────────────────────────────
  optional bool   PromptForDownloadLocation = 70 [json_name = "PromptForDownloadLocation", (bor.ui.field) = {group: "General"}];
  optional string DefaultDownloadDirectory  = 71 [json_name = "DefaultDownloadDirectory",  (bor.ui.field) = {group: "General"}];
  optional string DownloadDirectory         = 72 [json_name = "DownloadDirectory",         (bor.ui.field) = {group: "General"}];
  optional bool   DisableBuiltinPDFViewer   = 73 [json_name = "DisableBuiltinPDFViewer",   (bor.ui.field) = {group: "General"}];

  // ── Locale ────────────────────────────────────────────────────────────────
  repeated string RequestedLocales = 80 [json_name = "RequestedLocales", (bor.ui.field) = {group: "General"}];

  // ── Object / composite policies ───────────────────────────────────────────
  optional ThunderbirdDNSOverHTTPS   DNSOverHTTPS   = 90 [json_name = "DNSOverHTTPS",   (bor.ui.field) = {group: "Network"}];
  optional ThunderbirdCookies        Cookies        = 91 [json_name = "Cookies",        (bor.ui.field) = {group: "Cookies"}];
  optional ThunderbirdExtensions     Extensions     = 92 [json_name = "Extensions",     (bor.ui.field) = {group: "Add-ons"}];
  optional ThunderbirdProxy          Proxy          = 93 [json_name = "Proxy",          (bor.ui.field) = {group: "Network"}];
  optional ThunderbirdAuthentication Authentication = 94 [json_name = "Authentication", (bor.ui.field) = {group: "Authentication"}];
  optional ThunderbirdSearchEngines  SearchEngines  = 95 [json_name = "SearchEngines",  (bor.ui.field) = {group: "Search"}];
}

// ThunderbirdDNSOverHTTPS configures DNS-over-HTTPS settings.
message ThunderbirdDNSOverHTTPS {
  bool            Enabled         = 1 [json_name = "Enabled"];
  string          ProviderURL     = 2 [json_name = "ProviderURL"];
  bool            Locked          = 3 [json_name = "Locked"];
  repeated string ExcludedDomains = 4 [json_name = "ExcludedDomains"];
  bool            Fallback        = 5 [json_name = "Fallback"];
}

// ThunderbirdCookies configures cookie behaviour.
message ThunderbirdCookies {
  repeated string Allow                   = 1 [json_name = "Allow"];
  repeated string Block                   = 2 [json_name = "Block"];
  repeated string AllowSession            = 3 [json_name = "AllowSession"];
  string          Behavior                = 4 [
    json_name = "Behavior",
    (bor.ui.field) = {
      string_options: ["accept", "reject-foreign", "reject-all", "limit-foreign", "reject-tracker", "reject-tracker-and-partition-foreign"]
    }
  ];
  string          BehaviorPrivateBrowsing = 5 [
    json_name = "BehaviorPrivateBrowsing",
    (bor.ui.field) = {
      string_options: ["accept", "reject-foreign", "reject-all", "limit-foreign", "reject-tracker", "reject-tracker-and-partition-foreign"]
    }
  ];
  bool            Locked                  = 6 [json_name = "Locked"];
}

// ThunderbirdExtensions manages extension install/uninstall/lock lists.
message ThunderbirdExtensions {
  repeated string Install   = 1 [json_name = "Install"];
  repeated string Uninstall = 2 [json_name = "Uninstall"];
  repeated string Locked    = 3 [json_name = "Locked"];
}

// ThunderbirdProxy configures proxy settings.
message ThunderbirdProxy {
  string Mode                        = 1  [json_name = "Mode"];
  bool   Locked                      = 2  [json_name = "Locked"];
  string HTTPProxy                   = 3  [json_name = "HTTPProxy"];
  int32  HTTPPort                    = 4  [json_name = "HTTPPort"];
  bool   UseHTTPProxyForAllProtocols = 5  [json_name = "UseHTTPProxyForAllProtocols"];
  string SSLProxy                    = 6  [json_name = "SSLProxy"];
  int32  SSLPort                     = 7  [json_name = "SSLPort"];
  string SOCKSProxy                  = 8  [json_name = "SOCKSProxy"];
  int32  SOCKSPort                   = 9  [json_name = "SOCKSPort"];
  int32  SOCKSVersion                = 10 [json_name = "SOCKSVersion"];
  string Passthrough                 = 11 [json_name = "Passthrough"];
  string AutoConfigURL               = 12 [json_name = "AutoConfigURL"];
  bool   AutoLogin                   = 13 [json_name = "AutoLogin"];
  bool   UseProxyForDNS              = 14 [json_name = "UseProxyForDNS"];
}

// ThunderbirdAuthentication configures SPNEGO / NTLM authentication.
message ThunderbirdAuthentication {
  repeated string SPNEGO       = 1 [json_name = "SPNEGO"];
  repeated string Delegated    = 2 [json_name = "Delegated"];
  repeated string NTLM         = 3 [json_name = "NTLM"];
  bool            AllowNonFQDN = 4 [json_name = "AllowNonFQDN"];
  bool            AllowProxies = 5 [json_name = "AllowProxies"];
  bool            Locked       = 6 [json_name = "Locked"];
}

// ThunderbirdSearchEngine describes a search engine to add.
message ThunderbirdSearchEngine {
  string Name        = 1 [json_name = "Name"];
  string IconURL     = 2 [json_name = "IconURL"];
  string Alias       = 3 [json_name = "Alias"];
  string Description = 4 [json_name = "Description"];
  string Method      = 5 [json_name = "Method"];
  string URL         = 6 [json_name = "URL"];
}

// ThunderbirdSearchEngines configures search engine management.
message ThunderbirdSearchEngines {
  repeated ThunderbirdSearchEngine Add             = 1 [json_name = "Add"];
  string                           Default         = 2 [json_name = "Default"];
  bool                             PreventInstalls = 3 [json_name = "PreventInstalls"];
  repeated string                  Remove          = 4 [json_name = "Remove"];
}
