syntax = "proto3";

package bor.policy.v1;

option go_package = "github.com/VuteTech/Bor/server/pkg/grpc/policy;policy";

// ApparmorPolicy manages AppArmor on a node: whether it must be enabled and
// its service running, the restriction of unprivileged user namespaces, the
// mode of existing profiles, Bor-deployed profiles, site-local additions to
// vendor profiles and extra home directories. Several bound policies are
// merged per key by binding priority; on equal priority the more
// restrictive mode wins and conflicting texts are reported as errors.
message ApparmorPolicy {
  // Report a node without AppArmor as non-compliant instead of inapplicable.
  bool require_enabled = 1;
  // Enable and start apparmor.service when it is installed but inactive.
  bool ensure_service = 2;
  // kernel.apparmor_restrict_unprivileged_userns (Ubuntu kernels).
  ApparmorSwitch restrict_unprivileged_userns = 3;
  // kernel.apparmor_restrict_unprivileged_unconfined.
  ApparmorSwitch restrict_unprivileged_unconfined = 4;
  // Desired mode of existing profile files.
  repeated ApparmorProfileMode profiles = 5;
  // Bor-deployed profiles, written to /etc/apparmor.d/bor-<name>.
  repeated ApparmorCustomProfile custom_profiles = 6;
  // Rules added to vendor profiles through their local/ include.
  repeated ApparmorLocalOverride local_overrides = 7;
  // Extra home directory roots added to @{HOMEDIRS} through
  // tunables/home.d/bor, e.g. "/nfs/home/".
  repeated string extra_home_dirs = 8;
}

// ApparmorSwitch is a tri-state setting.
enum ApparmorSwitch {
  // Keep the node's value.
  APPARMOR_SWITCH_UNSPECIFIED = 0;
  APPARMOR_SWITCH_ON = 1;
  APPARMOR_SWITCH_OFF = 2;
}

// ApparmorMode is the desired mode of a profile file.
enum ApparmorMode {
  APPARMOR_MODE_UNSPECIFIED = 0;
  APPARMOR_MODE_ENFORCE = 1;
  APPARMOR_MODE_COMPLAIN = 2;
  // Unloaded and skipped at boot (a symlink in disable/).
  APPARMOR_MODE_DISABLED = 3;
}

// ApparmorProfileMode sets the mode of the profile files a pattern matches.
message ApparmorProfileMode {
  // A profile file name under /etc/apparmor.d ("usr.sbin.cupsd") or a glob
  // with * and ? ("usr.sbin.*", "*"). An exact name wins over a glob.
  string match = 1;
  ApparmorMode mode = 2;
  // For a vendor file that carries flags=(complain) itself: strip or set
  // the mode flags inside the file (a backup is kept and restored). Off by
  // default because the file is a package conffile.
  bool edit_vendor_flags = 3;
}

// ApparmorCustomProfile is a Bor-deployed profile file.
message ApparmorCustomProfile {
  // ^[a-z0-9][a-z0-9_.-]{0,63}$; the file and the profile are bor-<name>.
  string name = 1;
  // Complete profile text declaring "profile bor-<name> ..."; at most 64 KiB.
  string text = 2;
  string description = 3;
}

// ApparmorLocalOverride adds rules to a vendor profile that includes
// local/<profile_file>.
message ApparmorLocalOverride {
  // The vendor profile file name, e.g. "usr.sbin.cupsd".
  string profile_file = 1;
  // Rules written into the Bor managed block of
  // /etc/apparmor.d/local/<profile_file>; at most 64 KiB.
  string text = 2;
}

// ApparmorStatus is the AppArmor state a node reports with its inventory.
message ApparmorStatus {
  // /sys/module/apparmor/parameters/enabled is Y.
  bool enabled = 1;
  // apparmor is in the kernel's LSM list (it may still be disabled).
  bool in_lsm_list = 2;
  string parser_version = 3;
  // The kernel mediates user namespace creation (features/namespaces/mask).
  bool userns_mediation = 4;
  bool service_active = 5;
  bool service_enabled = 6;
  int32 enforce_count = 7;
  int32 complain_count = 8;
  int32 unconfined_count = 9;
  int32 kill_count = 10;
  // Values of the two user namespace sysctls; -1 when the kernel has none.
  int32 restrict_userns = 11;
  int32 restrict_unconfined = 12;
  // Kernel command line switches that affect AppArmor ("apparmor=0",
  // "security=selinux").
  repeated string boot_flags = 13;
  int32 profile_file_count = 14;
}

// ApparmorProfileInfo is one profile of a node: a loaded profile, a profile
// file under /etc/apparmor.d, or both.
message ApparmorProfileInfo {
  // Profile name as the kernel lists it ("/usr/sbin/cupsd", "firefox").
  string name = 1;
  // File name under /etc/apparmor.d, empty for profiles loaded from
  // elsewhere (snapd, container runtimes).
  string file = 2;
  // enforce | complain | unconfined | kill | prompt | "" (not loaded)
  string loaded_mode = 3;
  // The mode flag inside the file ("complain", "unconfined"), empty when the
  // file sets none (enforce).
  string file_mode = 4;
  // vendor | bor | snapd | docker | lxd | libvirt | runtime
  string managed_by = 5;
  // The file includes local/<file> (any spelling).
  bool has_local_include = 6;
  int32 attached_processes = 7;
  // A process runs unconfined although this profile attaches to its
  // executable: it needs a restart to be confined.
  bool unconfined_with_profile = 8;
  // Attachment path(s) of the profile, for conflict detection.
  repeated string attachments = 9;
  // A disable/ or force-complain/ symlink exists that Bor did not create.
  bool foreign_disable_link = 10;
  bool foreign_complain_link = 11;
  // Another profile on this node attaches to the same path.
  bool attachment_conflict = 12;
}
