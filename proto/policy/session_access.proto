syntax = "proto3";

package bor.policy.v1;

option go_package = "github.com/VuteTech/Bor/server/pkg/grpc/policy;policy";

// SessionAccessPolicy controls when selected users or groups may use a
// desktop session. The agent enforces it in two layers: logind actions
// (lock/terminate at the window boundary, warning notifications, re-lock
// watchdog) and optionally pam_time (denies unlocking and new logins
// outside the allowed windows).
//
// A user's allowed time is the union of the windows of every rule that
// targets them, across all bound SessionAccessPolicies. Users not targeted
// by any rule are unrestricted. Times are node-local wall clock.
message SessionAccessPolicy {
  repeated SessionAccessRule rules = 1;

  // Layer 2 (pam_time) on/off. When unset, defaults to true.
  optional bool enforce_pam = 2;

  // Also add sshd to the pam_time service list, denying SSH logins outside
  // the allowed windows. Default off: this is a desktop-usage feature and
  // an SSH lockout surprises admins.
  bool include_ssh = 3;
}

// SessionEndAction is what happens to a running session when its allowed
// window ends.
enum SessionEndAction {
  // Treated as SESSION_END_ACTION_LOCK.
  SESSION_END_ACTION_UNSPECIFIED = 0;
  // Lock the screen; the session and its applications keep running.
  SESSION_END_ACTION_LOCK = 1;
  // Terminate the session (log the user off).
  SESSION_END_ACTION_LOGOUT = 2;
}

// SessionAccessRule grants a set of users/groups a weekly schedule of
// allowed periods.
message SessionAccessRule {
  string description = 1;

  // Target users and/or groups; at least one of the two lists must be
  // non-empty. Group targets are expanded to user lists on the node at
  // apply time. "root" is never restricted.
  repeated string users = 2;
  repeated string groups = 3;

  // Allowed periods, node-local time. Within one rule and day, windows
  // must not overlap (they may touch).
  repeated SessionAccessWindow windows = 4;

  SessionEndAction end_action = 5;

  // Minutes before the window end at which to warn the logged-in user.
  // Strictly descending. Empty means the default [30, 15, 5].
  repeated int32 warn_minutes = 6;

  // Field numbers 7-15 are earmarked for v2 features (daily/weekly quotas,
  // grace period, suspend actions) — do not use them for anything else.
}

// SessionAccessWindow is a weekly-recurring allowed period.
message SessionAccessWindow {
  // Days the window starts on: "mon".."sun".
  repeated string days = 1;

  // Start of the allowed period, "HH:MM" (24h).
  string start = 2;

  // End of the allowed period, "HH:MM" (24h). An end at or before the
  // start crosses midnight into the next day ("22:00"-"02:00").
  string end = 3;
}
