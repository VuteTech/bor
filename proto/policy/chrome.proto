syntax = "proto3";

package bor.policy.v1;

import "google/protobuf/struct.proto";
import "ui.proto";

option go_package = "github.com/VuteTech/Bor/server/pkg/grpc/policy;policy";

// ChromePolicy holds all Chrome/Chromium enterprise policy settings for Linux.
// Each field maps to an official Chrome policy: https://chromeenterprise.google/policies/
// Only policies with Linux support are included.
// Field json_name annotations ensure protojson round-trips with the correct
// PascalCase Chrome policy key names.
message ChromePolicy {

  // =========================================================================
  // Homepage & Startup (1–50)
  // =========================================================================

  // Sets the browser home page URL.
  optional string HomepageLocation = 1 [json_name = "HomepageLocation", (bor.ui.field) = {group: "Homepage & Startup"}];

  // Use the New Tab Page as the home page.
  optional bool HomepageIsNewTabPage = 2 [json_name = "HomepageIsNewTabPage", (bor.ui.field) = {group: "Homepage & Startup"}];

  // Sets the New Tab Page URL.
  optional string NewTabPageLocation = 3 [json_name = "NewTabPageLocation", (bor.ui.field) = {group: "Homepage & Startup"}];

  // Action on startup: 1=open new tab, 4=open last session, 5=open list of URLs.
  optional int32 RestoreOnStartup = 4 [
    json_name = "RestoreOnStartup",
    (bor.ui.field) = {
      group: "Homepage & Startup",
      int_options: [
        {value: 1, label: "1 – Open the New Tab page"},
        {value: 4, label: "4 – Open a list of URLs"},
        {value: 5, label: "5 – Open the last session"}
      ]
    }
  ];

  // List of URLs to open on startup (requires RestoreOnStartup=5).
  repeated string RestoreOnStartupURLs = 5 [json_name = "RestoreOnStartupURLs", (bor.ui.field) = {group: "Homepage & Startup"}];

  // Show the Home button in the toolbar.
  optional bool ShowHomeButton = 6 [json_name = "ShowHomeButton", (bor.ui.field) = {group: "Homepage & Startup"}];

  // Whether to set Chrome as the default browser.
  optional bool DefaultBrowserSettingEnabled = 7 [json_name = "DefaultBrowserSettingEnabled", (bor.ui.field) = {group: "Browser UI"}];

  // Show the bookmark bar.
  optional bool BookmarkBarEnabled = 8 [json_name = "BookmarkBarEnabled", (bor.ui.field) = {group: "Browser UI"}];

  // Allow users to edit bookmarks.
  optional bool EditBookmarksEnabled = 9 [json_name = "EditBookmarksEnabled", (bor.ui.field) = {group: "Browser UI"}];

  // Managed bookmarks that cannot be deleted or edited by the user.
  // Value is a JSON array of bookmark objects with "name" and "url" (or "children").
  optional google.protobuf.Value ManagedBookmarks = 10 [json_name = "ManagedBookmarks", (bor.ui.field) = {group: "Browser UI"}];

  // =========================================================================
  // Extensions (51–100)
  // =========================================================================

  // Force-install extensions. List of "<extensionID>;<updateURL>" strings.
  repeated string ExtensionInstallForcelist = 51 [json_name = "ExtensionInstallForcelist", (bor.ui.field) = {group: "Extensions"}];

  // Block installation of listed extensions (use "*" to block all).
  repeated string ExtensionInstallBlocklist = 52 [json_name = "ExtensionInstallBlocklist", (bor.ui.field) = {group: "Extensions"}];

  // Allow installation of listed extensions even if they are in the blocklist.
  repeated string ExtensionInstallAllowlist = 53 [json_name = "ExtensionInstallAllowlist", (bor.ui.field) = {group: "Extensions"}];

  // Allow extensions to be installed from these URLs.
  repeated string ExtensionInstallSources = 54 [json_name = "ExtensionInstallSources", (bor.ui.field) = {group: "Extensions"}];

  // Allowed extension/app types: "extension", "theme", "user_script", "hosted_app", "legacy_packaged_app", "platform_app".
  repeated string ExtensionAllowedTypes = 55 [json_name = "ExtensionAllowedTypes", (bor.ui.field) = {group: "Extensions"}];

  // Fine-grained extension management settings (dictionary keyed by extension ID or "*").
  optional google.protobuf.Value ExtensionSettings = 56 [json_name = "ExtensionSettings", (bor.ui.field) = {group: "Extensions"}];

  // Deprecated: use ExtensionInstallBlocklist.
  repeated string ExtensionInstallBlacklist = 57 [json_name = "ExtensionInstallBlacklist", (bor.ui.field) = {group: "Extensions"}];

  // Deprecated: use ExtensionInstallAllowlist.
  repeated string ExtensionInstallWhitelist = 58 [json_name = "ExtensionInstallWhitelist", (bor.ui.field) = {group: "Extensions"}];

  // =========================================================================
  // Privacy & Security (101–150)
  // =========================================================================

  // Safe Browsing protection level: 0=off, 1=standard, 2=enhanced.
  optional int32 SafeBrowsingProtectionLevel = 101 [
    json_name = "SafeBrowsingProtectionLevel",
    (bor.ui.field) = {
      group: "Safe Browsing",
      chrome_only: true,
      int_options: [
        {value: 0, label: "0 – Safe Browsing off"},
        {value: 1, label: "1 – Standard protection"},
        {value: 2, label: "2 – Enhanced protection"}
      ]
    }
  ];

  // Enable Safe Browsing (deprecated; use SafeBrowsingProtectionLevel).
  optional bool SafeBrowsingEnabled = 102 [
    json_name = "SafeBrowsingEnabled",
    (bor.ui.field) = {group: "Safe Browsing", chrome_only: true}
  ];

  // Report Safe Browsing data to Google.
  optional bool SafeBrowsingExtendedReportingEnabled = 103 [
    json_name = "SafeBrowsingExtendedReportingEnabled",
    (bor.ui.field) = {group: "Safe Browsing", chrome_only: true}
  ];

  // URLs exempted from Safe Browsing checks.
  repeated string SafeBrowsingAllowlistDomains = 104 [
    json_name = "SafeBrowsingAllowlistDomains",
    (bor.ui.field) = {group: "Safe Browsing", chrome_only: true}
  ];

  // Block access to a list of URLs.
  repeated string URLBlocklist = 105 [json_name = "URLBlocklist", (bor.ui.field) = {group: "Network & Proxy"}];

  // Allow access to listed URLs (overrides URLBlocklist).
  repeated string URLAllowlist = 106 [json_name = "URLAllowlist", (bor.ui.field) = {group: "Network & Proxy"}];

  // Report Chrome usage and crash data to Google.
  optional bool MetricsReportingEnabled = 107 [
    json_name = "MetricsReportingEnabled",
    (bor.ui.field) = {group: "Privacy & Security", chrome_only: true}
  ];

  // Enable alternate error pages (Google web service when a page is not found).
  optional bool AlternateErrorPagesEnabled = 108 [json_name = "AlternateErrorPagesEnabled", (bor.ui.field) = {group: "Privacy & Security"}];

  // Block third-party cookies.
  optional bool BlockThirdPartyCookies = 109 [json_name = "BlockThirdPartyCookies", (bor.ui.field) = {group: "Privacy & Security"}];

  // Clear browsing data on exit.
  optional bool ClearSiteDataOnExit = 110 [json_name = "ClearSiteDataOnExit", (bor.ui.field) = {group: "Privacy & Security"}];

  // Disable saving browsing history.
  optional bool SavingBrowserHistoryDisabled = 111 [json_name = "SavingBrowserHistoryDisabled", (bor.ui.field) = {group: "Privacy & Security"}];

  // Allow users to delete browser history and download history.
  optional bool AllowDeletingBrowserHistory = 112 [json_name = "AllowDeletingBrowserHistory", (bor.ui.field) = {group: "Browser UI"}];

  // Disable 3D graphics APIs (WebGL).
  optional bool Disable3DAPIs = 113 [json_name = "Disable3DAPIs", (bor.ui.field) = {group: "Privacy & Security"}];

  // Disable SPDY protocol.
  optional bool DisableSpdy = 114 [json_name = "DisableSpdy", (bor.ui.field) = {group: "Network & Proxy"}];

  // Disable schemes (protocols); e.g. ["javascript"].
  repeated string DisabledSchemes = 115 [json_name = "DisabledSchemes", (bor.ui.field) = {group: "Network & Proxy"}];

  // Enable JavaScript.
  optional bool JavascriptEnabled = 116 [json_name = "JavascriptEnabled", (bor.ui.field) = {group: "Content Settings"}];

  // Allow or block access to file:// URLs for extensions.
  optional bool AllowFileSelectionDialogs = 117 [json_name = "AllowFileSelectionDialogs", (bor.ui.field) = {group: "Miscellaneous"}];

  // Enable DNS prefetching.
  optional bool DnsPrefetchingEnabled = 118 [json_name = "DnsPrefetchingEnabled", (bor.ui.field) = {group: "Network & Proxy"}];

  // DNS-over-HTTPS mode: "off", "automatic", "secure".
  optional string DnsOverHttpsMode = 119 [
    json_name = "DnsOverHttpsMode",
    (bor.ui.field) = {
      group: "Network & Proxy",
      string_options: ["off", "automatic", "secure"]
    }
  ];

  // URI template of the desired DNS-over-HTTPS resolver.
  optional string DnsOverHttpsTemplates = 120 [json_name = "DnsOverHttpsTemplates", (bor.ui.field) = {group: "Network & Proxy"}];

  // Control network prediction (preloading): 0=always, 2=WiFi-only, 4=never.
  optional int32 NetworkPredictionOptions = 121 [
    json_name = "NetworkPredictionOptions",
    (bor.ui.field) = {
      group: "Network & Proxy",
      int_options: [
        {value: 0, label: "0 – Predict on all networks"},
        {value: 2, label: "2 – Predict on Wi-Fi and Ethernet only"},
        {value: 3, label: "3 – Never predict"}
      ]
    }
  ];

  // SSL version min: "tls1", "tls1.1", "tls1.2", "tls1.3".
  optional string SSLVersionMin = 122 [
    json_name = "SSLVersionMin",
    (bor.ui.field) = {
      group: "Privacy & Security",
      string_options: ["tls1", "tls1.1", "tls1.2", "tls1.3"]
    }
  ];

  // Enable QUIC protocol.
  optional bool QuicAllowed = 123 [json_name = "QuicAllowed", (bor.ui.field) = {group: "Network & Proxy"}];

  // Maximum number of simultaneous connections to a proxy server.
  optional int32 MaxConnectionsPerProxy = 124 [json_name = "MaxConnectionsPerProxy", (bor.ui.field) = {group: "Network & Proxy"}];

  // Allow HTTP/0.9 on non-standard ports.
  optional bool Http09OnNonDefaultPortsEnabled = 125 [json_name = "Http09OnNonDefaultPortsEnabled", (bor.ui.field) = {group: "Network & Proxy"}];

  // Incognito mode: 0=available, 1=disabled, 2=forced.
  optional int32 IncognitoModeAvailability = 126 [
    json_name = "IncognitoModeAvailability",
    (bor.ui.field) = {
      group: "Privacy & Security",
      int_options: [
        {value: 0, label: "0 – Incognito available"},
        {value: 1, label: "1 – Incognito disabled"},
        {value: 2, label: "2 – Incognito forced"}
      ]
    }
  ];

  // Enable incognito mode (deprecated; use IncognitoModeAvailability).
  optional bool IncognitoEnabled = 127 [json_name = "IncognitoEnabled", (bor.ui.field) = {group: "Privacy & Security"}];

  // Enable the dinosaur Easter egg game (offline page).
  optional bool AllowDinosaurEasterEgg = 128 [json_name = "AllowDinosaurEasterEgg", (bor.ui.field) = {group: "Privacy & Security"}];

  // HSTS preload list: 0=enabled, 1=disabled.
  optional bool HSTSPolicyBypassList = 129 [json_name = "HSTSPolicyBypassList", (bor.ui.field) = {group: "Privacy & Security"}];

  // Certificate Transparency enforcement: list of URLs to exclude.
  repeated string CertificateTransparencyEnforcementDisabledForUrls = 130 [json_name = "CertificateTransparencyEnforcementDisabledForUrls", (bor.ui.field) = {group: "Miscellaneous"}];

  // Certificate Transparency enforcement: list of certificate hashes to exclude.
  repeated string CertificateTransparencyEnforcementDisabledForCas = 131 [json_name = "CertificateTransparencyEnforcementDisabledForCas", (bor.ui.field) = {group: "Miscellaneous"}];

  // Certificate Transparency enforcement: list of legacy certificate hashes.
  repeated string CertificateTransparencyEnforcementDisabledForLegacyCas = 132 [json_name = "CertificateTransparencyEnforcementDisabledForLegacyCas", (bor.ui.field) = {group: "Miscellaneous"}];

  // Require online OCSP/CRL checks for local trust anchors.
  optional bool RequireOnlineRevocationChecksForLocalAnchors = 133 [json_name = "RequireOnlineRevocationChecksForLocalAnchors", (bor.ui.field) = {group: "Privacy & Security"}];

  // Additional CA certificates to trust (list of base64-encoded DER certs).
  optional google.protobuf.Value PolicyCertificateAuthorities = 134 [json_name = "PolicyCertificateAuthorities", (bor.ui.field) = {group: "Privacy & Security"}];

  // =========================================================================
  // Network & Proxy (151–200)
  // =========================================================================

  // Proxy settings dictionary (mode, server, pac url, bypass list).
  optional google.protobuf.Value ProxySettings = 151 [json_name = "ProxySettings", (bor.ui.field) = {group: "Miscellaneous"}];

  // Proxy mode: "direct", "auto_detect", "pac_script", "fixed_servers", "system".
  optional string ProxyMode = 152 [
    json_name = "ProxyMode",
    (bor.ui.field) = {
      group: "Network & Proxy",
      string_options: ["direct", "auto_detect", "pac_script", "fixed_servers", "system"]
    }
  ];

  // Proxy server mode (integer, deprecated; prefer ProxyMode).
  optional int32 ProxyServerMode = 153 [json_name = "ProxyServerMode", (bor.ui.field) = {group: "Network & Proxy"}];

  // Proxy server address ("host:port").
  optional string ProxyServer = 154 [json_name = "ProxyServer", (bor.ui.field) = {group: "Network & Proxy"}];

  // URL for the proxy auto-config (PAC) script.
  optional string ProxyPacUrl = 155 [json_name = "ProxyPacUrl", (bor.ui.field) = {group: "Network & Proxy"}];

  // Semicolon-separated list of hosts that bypass the proxy.
  optional string ProxyBypassList = 156 [json_name = "ProxyBypassList", (bor.ui.field) = {group: "Network & Proxy"}];

  // HTTP authentication schemes to support (comma-separated).
  optional string AuthSchemes = 157 [json_name = "AuthSchemes", (bor.ui.field) = {group: "HTTP Authentication"}];

  // Disable CNAME lookup when negotiating Kerberos/NTLM auth.
  optional bool DisableAuthNegotiateCnameLookup = 158 [json_name = "DisableAuthNegotiateCnameLookup", (bor.ui.field) = {group: "HTTP Authentication"}];

  // Include port in Kerberos SPN when negotiating auth.
  optional bool EnableAuthNegotiatePort = 159 [json_name = "EnableAuthNegotiatePort", (bor.ui.field) = {group: "HTTP Authentication"}];

  // Allowlist of servers for integrated Windows authentication.
  optional string AuthServerAllowlist = 160 [json_name = "AuthServerAllowlist", (bor.ui.field) = {group: "HTTP Authentication"}];

  // Servers to which Kerberos credentials can be delegated.
  optional string AuthNegotiateDelegateAllowlist = 161 [json_name = "AuthNegotiateDelegateAllowlist", (bor.ui.field) = {group: "HTTP Authentication"}];

  // Deprecated form of AuthServerAllowlist.
  optional string AuthServerWhitelist = 162 [json_name = "AuthServerWhitelist", (bor.ui.field) = {group: "HTTP Authentication"}];

  // Deprecated form of AuthNegotiateDelegateAllowlist.
  optional string AuthNegotiateDelegateWhitelist = 163 [json_name = "AuthNegotiateDelegateWhitelist", (bor.ui.field) = {group: "HTTP Authentication"}];

  // Path to the GSSAPI library (Linux only).
  optional string GSSAPILibraryName = 164 [json_name = "GSSAPILibraryName", (bor.ui.field) = {group: "HTTP Authentication"}];

  // Allow cross-origin authentication prompts.
  optional bool AllowCrossOriginAuthPrompt = 165 [json_name = "AllowCrossOriginAuthPrompt", (bor.ui.field) = {group: "HTTP Authentication"}];

  // Disable WPAD optimisation (Quick-check).
  optional bool WPADQuickCheckEnabled = 166 [json_name = "WPADQuickCheckEnabled", (bor.ui.field) = {group: "Miscellaneous"}];

  // Force network traffic through HTTPS.
  optional bool HttpsOnlyMode = 167 [json_name = "HttpsOnlyMode", (bor.ui.field) = {group: "Privacy & Security"}];

  // Upgrade insecure requests to HTTPS.
  optional bool UpgradeHttpRequests = 168 [json_name = "UpgradeHttpRequests", (bor.ui.field) = {group: "Privacy & Security"}];

  // =========================================================================
  // Content Settings (201–250)
  // =========================================================================

  // Default cookies setting: 1=allow, 2=block, 4=session-only.
  optional int32 DefaultCookiesSetting = 201 [
    json_name = "DefaultCookiesSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 1, label: "1 – Allow all cookies"},
        {value: 2, label: "2 – Block all cookies"},
        {value: 4, label: "4 – Session only cookies"}
      ]
    }
  ];

  // Default images setting: 1=allow, 2=block.
  optional int32 DefaultImagesSetting = 202 [
    json_name = "DefaultImagesSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 1, label: "1 – Allow all images"},
        {value: 2, label: "2 – Block all images"}
      ]
    }
  ];

  // Default JavaScript setting: 1=allow, 2=block.
  optional int32 DefaultJavaScriptSetting = 203 [
    json_name = "DefaultJavaScriptSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 1, label: "1 – Allow JavaScript"},
        {value: 2, label: "2 – Block JavaScript"}
      ]
    }
  ];

  // Default pop-ups setting: 1=allow, 2=block.
  optional int32 DefaultPopupsSetting = 204 [
    json_name = "DefaultPopupsSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 1, label: "1 – Allow popups"},
        {value: 2, label: "2 – Block popups"}
      ]
    }
  ];

  // Default notifications setting: 1=allow, 2=block, 3=ask.
  optional int32 DefaultNotificationsSetting = 205 [
    json_name = "DefaultNotificationsSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 1, label: "1 – Allow notifications"},
        {value: 2, label: "2 – Block notifications"},
        {value: 3, label: "3 – Ask each time"}
      ]
    }
  ];

  // Default geolocation setting: 1=allow, 2=block, 3=ask.
  optional int32 DefaultGeolocationSetting = 206 [
    json_name = "DefaultGeolocationSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 1, label: "1 – Allow geolocation"},
        {value: 2, label: "2 – Block geolocation"},
        {value: 3, label: "3 – Ask each time"}
      ]
    }
  ];

  // Default WebUSB setting: 1=allow, 2=block, 3=ask.
  optional int32 DefaultWebUsbGuardSetting = 207 [
    json_name = "DefaultWebUsbGuardSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 2, label: "2 – Block access"},
        {value: 3, label: "3 – Ask each time"}
      ]
    }
  ];

  // Default file system read access: 1=allow, 2=block, 3=ask.
  optional int32 DefaultFileSystemReadGuardSetting = 208 [
    json_name = "DefaultFileSystemReadGuardSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 2, label: "2 – Block access"},
        {value: 3, label: "3 – Ask each time"}
      ]
    }
  ];

  // Default file system write access: 1=allow, 2=block, 3=ask.
  optional int32 DefaultFileSystemWriteGuardSetting = 209 [
    json_name = "DefaultFileSystemWriteGuardSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 2, label: "2 – Block access"},
        {value: 3, label: "3 – Ask each time"}
      ]
    }
  ];

  // Default sensors access (device motion/orientation): 1=allow, 2=block.
  optional int32 DefaultSensorsSetting = 210 [
    json_name = "DefaultSensorsSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 1, label: "1 – Allow access"},
        {value: 2, label: "2 – Block access"}
      ]
    }
  ];

  // Default serial port access: 1=allow, 2=block, 3=ask.
  optional int32 DefaultSerialGuardSetting = 211 [
    json_name = "DefaultSerialGuardSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 2, label: "2 – Block access"},
        {value: 3, label: "3 – Ask each time"}
      ]
    }
  ];

  // Automatically select certificates matching these filters.
  repeated string AutoSelectCertificateForUrls = 212 [json_name = "AutoSelectCertificateForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Allow cookies for these URL patterns.
  repeated string CookiesAllowedForUrls = 213 [json_name = "CookiesAllowedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Block cookies for these URL patterns.
  repeated string CookiesBlockedForUrls = 214 [json_name = "CookiesBlockedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Allow session-only cookies for these URL patterns.
  repeated string CookiesSessionOnlyForUrls = 215 [json_name = "CookiesSessionOnlyForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Allow images for these URL patterns.
  repeated string ImagesAllowedForUrls = 216 [json_name = "ImagesAllowedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Block images for these URL patterns.
  repeated string ImagesBlockedForUrls = 217 [json_name = "ImagesBlockedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Allow JavaScript for these URL patterns.
  repeated string JavaScriptAllowedForUrls = 218 [json_name = "JavaScriptAllowedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Block JavaScript for these URL patterns.
  repeated string JavaScriptBlockedForUrls = 219 [json_name = "JavaScriptBlockedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Allow pop-ups for these URL patterns.
  repeated string PopupsAllowedForUrls = 220 [json_name = "PopupsAllowedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Block pop-ups for these URL patterns.
  repeated string PopupsBlockedForUrls = 221 [json_name = "PopupsBlockedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Allow notifications for these URL patterns.
  repeated string NotificationsAllowedForUrls = 222 [json_name = "NotificationsAllowedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Block notifications for these URL patterns.
  repeated string NotificationsBlockedForUrls = 223 [json_name = "NotificationsBlockedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Allow WebUSB for these URL patterns.
  repeated string WebUsbAllowDevicesForUrls = 224 [json_name = "WebUsbAllowDevicesForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Block WebUSB for these URL patterns.
  repeated string WebUsbAskForUrls = 225 [json_name = "WebUsbAskForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Block WebUSB for these URL patterns.
  repeated string WebUsbBlockedForUrls = 226 [json_name = "WebUsbBlockedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Allow geolocation for these URL patterns.
  repeated string DefaultGeolocationAllowedForUrls = 227 [json_name = "DefaultGeolocationAllowedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // Block geolocation for these URL patterns.
  repeated string DefaultGeolocationBlockedForUrls = 228 [json_name = "DefaultGeolocationBlockedForUrls", (bor.ui.field) = {group: "Content Settings"}];

  // JIT compiler for JavaScript: list of URLs where JIT is disabled.
  repeated string JavaScriptJitBlockedForSites = 229 [json_name = "JavaScriptJitBlockedForSites", (bor.ui.field) = {group: "Content Settings"}];

  // JIT compiler for JavaScript: list of URLs where JIT is allowed.
  repeated string JavaScriptJitAllowedForSites = 230 [json_name = "JavaScriptJitAllowedForSites", (bor.ui.field) = {group: "Content Settings"}];

  // Default legacy SameSite cookie behaviour (deprecated).
  optional int32 LegacySameSiteCookieBehaviorEnabled = 231 [
    json_name = "LegacySameSiteCookieBehaviorEnabled",
    (bor.ui.field) = {
      group: "Miscellaneous",
      int_options: [
        {value: 0, label: "0 – Use default behavior for all cookies"},
        {value: 1, label: "1 – Revert to legacy behavior for all cookies"},
        {value: 2, label: "2 – Use default behavior for cookies on all sites"}
      ]
    }
  ];

  // Override legacy cookie behaviour for these URL patterns.
  repeated string LegacySameSiteCookieBehaviorEnabledForDomainList = 232 [json_name = "LegacySameSiteCookieBehaviorEnabledForDomainList", (bor.ui.field) = {group: "Miscellaneous"}];

  // Allow third-party storage partitioning for these origins.
  repeated string StorageAccessAPIAllowlistBypassedForOrigins = 233 [json_name = "StorageAccessAPIAllowlistBypassedForOrigins", (bor.ui.field) = {group: "Content Settings"}];

  // Default WebBluetooth setting: 1=allow, 2=block, 3=ask.
  optional int32 DefaultWebBluetoothGuardSetting = 234 [
    json_name = "DefaultWebBluetoothGuardSetting",
    (bor.ui.field) = {
      group: "Content Settings",
      int_options: [
        {value: 2, label: "2 – Block access"},
        {value: 3, label: "3 – Ask each time"}
      ]
    }
  ];

  // =========================================================================
  // Safe Browsing (251–300)
  // =========================================================================

  // Enable downloading of malicious file type warnings.
  optional bool SafeBrowsingForTrustedSourcesEnabled = 251 [json_name = "SafeBrowsingForTrustedSourcesEnabled", (bor.ui.field) = {group: "Safe Browsing"}];

  // Disable Safe Browsing bypass prompts for listed domains.
  repeated string SafeBrowsingAllowlistForDomains = 252 [json_name = "SafeBrowsingAllowlistForDomains", (bor.ui.field) = {group: "Safe Browsing"}];

  // Enable real-time Safe Browsing checks.
  optional bool SafeBrowsingRealTimeLookupsEnabled = 253 [json_name = "SafeBrowsingRealTimeLookupsEnabled", (bor.ui.field) = {group: "Safe Browsing"}];

  // Allow bypassing Safe Browsing warnings for malicious downloads.
  optional bool SafeBrowsingDeepScanningEnabled = 254 [json_name = "SafeBrowsingDeepScanningEnabled", (bor.ui.field) = {group: "Safe Browsing"}];

  // =========================================================================
  // Password & Autofill (301–350)
  // =========================================================================

  // Enable the password manager.
