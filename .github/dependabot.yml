version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /server/web/frontend
    schedule:
      interval: weekly
    ignore:
      # ESLint 10 cannot be installed until eslint-plugin-jsx-a11y declares
      # support for it (6.10.x allows eslint ^3 to ^9 only): npm ci fails with
      # ERESOLVE. Drop this once jsx-a11y ships an ESLint 10 peer range.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript 7 cannot be installed while the @typescript-eslint packages
      # declare a peer range of typescript >=4.8.4 <6.1.0: the update job fails
      # to resolve and aborts. Drop this once they support TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
