name: Documentation

# Builds the MkDocs site (mkdocs.yml, doc/) and publishes it to GitHub Pages
# (docs.getbor.dev) on every push to master. Pull requests only build it, in
# strict mode, so broken links and missing files fail the check before merge.

on:
  push:
    branches: [master]
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, but a
# deployment already in progress is allowed to finish.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install MkDocs
        run: pip install -r doc/requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
